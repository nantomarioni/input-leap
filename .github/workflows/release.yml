name: Release

on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - fork
    tags:
      - 'fork-v*'

# Set the build type here
env:
  B_BUILD_TYPE: 'Release'
  DEBIAN_FRONTEND: noninteractive

jobs:
  mac-build:
    name: ${{ matrix.name}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
       include:
         - name: macOS-Apple_Silicon
           os: macos-14
           qt-version: 6.6
           min-macOS-version: 14
           arch: 'arm64'

    env:
      VERBOSE: 1
      TERM: xterm-256color
      OpenSSL_Install_Path: "/Users/runner/openssl"
      OpenSSL_Version: 3.2.0

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{matrix.qt-version}}
          modules: ${{matrix.qt-modules}}
          cache: true
          cache-key-prefix: macOS-${{matrix.os}}-Qt${{matrix.qt-version}}

      - name: Setup the image
        run: |
          brew install ninja

      - name: Cache OpenSSL
        id: cache-openssl
        if: matrix.os == 'macos-14'
        uses: actions/cache@v4.2.4
        with:
          path: ${{env.OpenSSL_Install_Path}}
          key: macOS-${{matrix.os}}-ssl-${{matrix.arch}}-${{env.OpenSSL_Version}}

      - name: Build OpenSSL
        if: ((steps.cache-openssl.outputs.cache-hit != 'true') && (matrix.os == 'macos-14'))
        run: |
          wget https://github.com/openssl/openssl/releases/download/openssl-${{env.OpenSSL_Version}}/openssl-${{env.OpenSSL_Version}}.tar.gz
          tar -xf openssl-${{env.OpenSSL_Version}}.tar.gz
          echo "#!/bin/bash
          if [[ \$* == *-arch\ x86_64* ]] && ! [[ \$* == *-arch\ arm64* ]]; then
            cc -arch arm64 \$@
          else
            cc \$@
          fi" >> /Users/runner/cc_override
          chmod a+x /Users/runner/cc_override
          cat /Users/runner/cc_override
          export MACOSX_DEPLOYMENT_TARGET=${{matrix.min-macOS-version}}
          export CC=/Users/runner/cc_override
          cd openssl-${{env.OpenSSL_Version}}
          ./configure no-asm darwin64-x86_64-cc --prefix=${{env.OpenSSL_Install_Path}}
          make
          make install

      - uses: actions/checkout@v4
        with:
          path: input-leap
          submodules: recursive

      - name: Setup the build
        run: |
          cmake -DCMAKE_BUILD_TYPE="${B_BUILD_TYPE}" -S input-leap -B build -G Ninja \
                -DCMAKE_UNITY_BUILD=1 \
                -DOpenSSL_ROOT=${{env.OpenSSL_Install_Path}} \
                -DCMAKE_OSX_SYSROOT=$(xcode-select --print-path)/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=${{matrix.min-macOS-version}} -DCMAKE_UNITY_BUILD=1 \
                -DQT_DEFAULT_MAJOR_VERSION=$(echo ${{matrix.qt-version}} | cut -c -1) \
                -DINPUTLEAP_VERSION_DESC=git \
                -DINPUTLEAP_BUILD_GULRAK_FILESYSTEM=${{ matrix.qt-version == '5.15' && '1' || '0' }} \
                -DCMAKE_OSX_ARCHITECTURES="${{matrix.arch}}"

      - name: Run the build
        run: |
          cmake --build build --parallel

      # Sign with a stable identity so macOS TCC permissions (Accessibility /
      # Input Monitoring) survive updates, then repackage the dmg from the
      # signed bundle (the build's own dmg contains the unsigned app).
      - name: Sign the bundle and repackage the dmg
        if: env.B_BUILD_TYPE == 'Release'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::MACOS_CERT_P12 secret not set; shipping unsigned dmg (TCC permissions will reset on update)"
            exit 0
          fi
          echo "$MACOS_CERT_P12" | base64 -d > cert.p12
          security create-keychain -p ci-keychain-pass build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain-pass build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain-pass build.keychain
          rm cert.p12

          DMG=$(ls build/bundle/*.dmg)
          rm "$DMG"
          codesign --force --deep --sign "InputLeap Fork" build/bundle/InputLeap.app
          codesign --verify --deep --verbose=2 build/bundle/InputLeap.app
          hdiutil create -volname InputLeap -srcfolder build/bundle/InputLeap.app -ov -format UDZO "$DMG"

      - uses: actions/upload-artifact@v4
        if: env.B_BUILD_TYPE == 'Release'
        with:
          name: ${{ matrix.name }}-installer
          path: ./build/bundle/*.dmg
          if-no-files-found: error

      - name: Archive debug app
        if: env.B_BUILD_TYPE != 'Release'
        run: tar -czf InputLeap-${{matrix.name}}.tar.gz -C build/bundle InputLeap.app

      - uses: actions/upload-artifact@v4
        if: env.B_BUILD_TYPE != 'Release'
        with:
          name: ${{ matrix.name }}-debug
          path: ./InputLeap*.tar.gz
          if-no-files-found: error

  win-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
       include:
         - name: Windows Qt6
           os: windows-2022
           qt-version: 6.6
           qt-major: 6

    steps:
      - uses: actions/checkout@v4
        with:
          path: input-leap
          submodules: recursive

      - name: Download Bonjour SDK-like
        id: bonjour
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Force -ItemType Directory -Path .\deps

          Invoke-WebRequest 'https://github.com/nelsonjchen/mDNSResponder/releases/download/v2019.05.08.1/x64_RelWithDebInfo.zip' -OutFile 'deps\BonjourSDKLike.zip' ;
          Expand-Archive .\deps\BonjourSDKLike.zip -DestinationPath .\deps\BonjourSDKLike
          Remove-Item deps\BonjourSDKLike.zip

          "path=$env:GITHUB_WORKSPACE\deps\BonjourSDKLike" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{matrix.qt-version}}
          modules: ${{matrix.qt-modules}}
          cache: true
          cache-key-prefix: windows-${{matrix.os}}-Qt${{matrix.qt-version}}

      - name: Configure build system
        run: |
          New-Item -Force -ItemType Directory -Path .\build | Out-Null

          cd build

          cmake -S ..\input-leap -G "$env:CMAKE_GEN" -A x64 -D CMAKE_BUILD_TYPE=$B_BUILD_TYPE `
            -DQT_DEFAULT_MAJOR_VERSION=${{matrix.qt-major}} `
            -DINPUTLEAP_VERSION_DESC=git `
            -DINPUTLEAP_BUILD_GULRAK_FILESYSTEM=${{ matrix.qt-major == '5' && '1' || '0' }} `
            -DDNSSD_LIB="$env:BONJOUR_SDK_HOME\Lib\x64\dnssd.lib" -D CMAKE_INSTALL_PREFIX=input-leap-install
        env:
          VS_PATH: ${{ matrix.os == 'windows-2019' && '%ProgramFiles(x86)%\Microsoft Visual Studio\2019' || '%ProgramFiles%\Microsoft Visual Studio\2022' }}
          CMAKE_GEN: ${{ matrix.os == 'windows-2019' && 'Visual Studio 16 2019' || 'Visual Studio 17 2022' }}
          BONJOUR_SDK_HOME: ${{ steps.bonjour.outputs.path }}

      - name: Run build system
        run: |
          cmake --build build --config $env:B_BUILD_TYPE --target install

      - name: Create Archive
        run: Compress-Archive -Path build\input-leap-install\* -DestinationPath ${{ env.B_BUILD_TYPE }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ env.B_BUILD_TYPE }}
          path: ${{ env.B_BUILD_TYPE }}.zip
          if-no-files-found: warn

      - name: Build the Installer
        if: env.B_BUILD_TYPE == 'Release'
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp .\build\installer-inno\input-leap.iss

      - uses: actions/upload-artifact@v4
        if: env.B_BUILD_TYPE == 'Release'
        with:
          name: windows-installer-${{ matrix.name }}
          path: .\build\installer-inno\bin
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [mac-build, win-build]
    if: github.ref == 'refs/heads/fork' || startsWith(github.ref, 'refs/tags/fork-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        id: assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.dmg' -exec cp {} release-assets/ \;
          find artifacts -name '*.exe' -exec cp {} release-assets/ \;
          ls -la release-assets/
          # Derive the version string from the dmg filename (InputLeap-<version>.dmg)
          DMG=$(ls release-assets/*.dmg | head -1)
          VERSION=$(basename "$DMG" .dmg | sed 's/^InputLeap-//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Dev channel: every push to `fork` updates the rolling `latest-build`
      # prerelease. The tag is deleted and recreated so it always points at
      # the commit that produced the assets.
      - name: Update rolling latest-build release (dev channel)
        if: github.ref == 'refs/heads/fork'
        run: |
          gh release delete latest-build -R "${{ github.repository }}" --yes || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest-build" || true
          gh release create latest-build \
            -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Latest build (${{ steps.assets.outputs.version }})" \
            --notes "Automated dev-channel build.
          Commit: ${{ github.sha }}
          Version: ${{ steps.assets.outputs.version }}" \
            release-assets/*

      # Stable channel: pushing a fork-v* tag blesses a known-good build as a
      # permanent, non-prerelease Release.
      - name: Create stable release (fork-v* tag)
        if: startsWith(github.ref, 'refs/tags/fork-v')
        run: |
          gh release create "${{ github.ref_name }}" \
            -R "${{ github.repository }}" \
            --title "${{ github.ref_name }} (${{ steps.assets.outputs.version }})" \
            --generate-notes \
            release-assets/*
